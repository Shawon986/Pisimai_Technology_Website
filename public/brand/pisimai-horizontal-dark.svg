<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="PISIMAI TECHNOLOGY">
  <defs>
    <linearGradient id="markGradient" x1="36" y1="22" x2="176" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62F2F4"/><stop offset=".48" stop-color="#278EFF"/><stop offset="1" stop-color="#8A72FF"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="270" y1="0" x2="690" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFF"/><stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <style>
      .p-mark{fill:none;stroke:url(#markGradient);stroke-width:17;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:430;stroke-dashoffset:430;animation:p-draw-loop 6s cubic-bezier(.35,.05,.25,1) .12s infinite,p-glow 5.8s ease-in-out 1.9s infinite}
      .p-highlight{fill:none;stroke:#D9FFFF;stroke-width:2;stroke-linecap:round;opacity:.48}
      .wordmark{fill:url(#wordGradient);font-family:Arial,Helvetica,sans-serif;font-size:61px;font-weight:700;letter-spacing:5px}
      .descriptor{fill:#55DCEB;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:600;letter-spacing:11px}
      @keyframes p-draw-loop{0%,100%{stroke-dashoffset:430}38%,82%{stroke-dashoffset:0}83%{stroke-dashoffset:430}}
      @keyframes p-glow{0%,100%{filter:drop-shadow(0 0 2px rgba(65,220,255,.16))}50%{filter:drop-shadow(0 0 8px rgba(65,220,255,.48))}}
      @media(prefers-reduced-motion:reduce){.p-mark{animation:none;stroke-dasharray:none;stroke-dashoffset:0;filter:none}}
    </style>
  </defs>
  <rect width="900" height="190" fill="#070B16"/>
  <path class="p-mark" d="M53 145V48C53 37 62 28 73 28H113C137 28 153 44 153 66C153 88 137 104 113 104H53"/>
